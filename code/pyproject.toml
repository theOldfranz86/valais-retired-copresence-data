[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-paper"
version = "0.1.0"
description = "Reproducible quantitative analyses for the Vivre les espaces montagnards article."
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.11,<4",
  "numpy>=2.3,<3",
  "openpyxl>=3.1,<4",
  "pandas>=3.0,<4",
  "python-docx>=1.2,<2",
  "scipy>=1.18,<2",
  "statsmodels>=0.14.6,<0.15",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
analyze-descriptive-copresence = "quantitative_paper.descriptive_copresence:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
